<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dosai documentation</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="Dosai inspects .NET source, assemblies, and NuGet packages for security review: methods, call graphs, data-flow slices, crypto evidence, and reachability." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <link rel="icon" href="_media/dosai.svg" type="image/svg+xml" />
    <link rel="stylesheet" media="(prefers-color-scheme: dark)" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css" />
    <link rel="stylesheet" media="(prefers-color-scheme: light)" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;700&display=swap');
      :root {
        --theme-hue: 36;
        --base-font-size: 15px;
        --theme-color: #d97706;
        --modular-scale: 1.333;
        --modular-scale--2: calc(var(--modular-scale--1) / var(--modular-scale));
        --modular-scale--1: calc(var(--modular-scale-1) / var(--modular-scale));
        --modular-scale-1: 1rem;
        --modular-scale-2: calc(var(--modular-scale-1) * var(--modular-scale));
        --modular-scale-3: calc(var(--modular-scale-2) * var(--modular-scale));
        --modular-scale-4: calc(var(--modular-scale-3) * var(--modular-scale));
        --modular-scale-5: calc(var(--modular-scale-4) * var(--modular-scale));
        --font-size-xxxl: var(--modular-scale-5);
        --font-size-xxl: var(--modular-scale-4);
        --font-size-xl: var(--modular-scale-3);
        --font-size-l: var(--modular-scale-2);
        --font-size-m: var(--modular-scale-1);
        --font-size-s: var(--modular-scale--1);
        --font-size-xs: var(--modular-scale--2);
        --cover-max-width: 78em;
        --content-max-width: 82em;
      }

      body {
        background:
          radial-gradient(circle at top left, rgba(217, 119, 6, 0.12), transparent 32%),
          radial-gradient(circle at top right, rgba(124, 92, 255, 0.08), transparent 28%);
      }

      section.cover.show {
        background: transparent;
      }

      section.cover .cover-main {
        max-width: min(76rem, calc(100vw - 2rem));
        margin: 2rem auto 0;
        padding: 3rem 3.25rem 3.5rem;
        text-align: left;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 80px rgba(17, 24, 39, 0.14);
      }

      @media (prefers-color-scheme: dark) {
        section.cover .cover-main {
          background: rgba(17, 24, 39, 0.88);
          box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        }
      }

      section.cover .cover-main > h1 {
        font-size: clamp(2.8rem, 6vw, 4.8rem);
        line-height: 1.02;
        margin-bottom: 1rem;
        letter-spacing: -0.04em;
      }

      section.cover .cover-main > blockquote {
        margin: 0 0 1.5rem;
        padding-left: 1rem;
        border-left: 4px solid var(--theme-color);
        color: var(--theme-color);
        font-size: 1.08rem;
        font-weight: 600;
      }

      section.cover .cover-main > p:last-of-type {
        display: flex;
        flex-wrap: wrap;
        gap: 0.85rem;
        justify-content: flex-start;
        margin-top: 1.5rem;
      }

      section.cover .cover-main > p:last-of-type a {
        margin: 0;
        padding: 0.8rem 1.1rem;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
        box-shadow: none;
      }

      section.cover .cover-main ul {
        column-gap: 2rem;
      }

      .markdown-section {
        line-height: 1.65;
      }

      .markdown-section h1,
      .markdown-section h2,
      .markdown-section h3 {
        letter-spacing: -0.02em;
      }

      .mermaid {
        display: flex;
        justify-content: center;
        margin: 1.25rem 0;
      }

      @media (max-width: 960px) {
        section.cover .cover-main {
          margin-top: 1rem;
          padding: 2.25rem 1.5rem 2.5rem;
          text-align: center;
        }

        section.cover .cover-main > blockquote {
          padding-left: 0;
          border-left: 0;
        }

        section.cover .cover-main > p:last-of-type {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      function mermaidTheme() {
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default';
      }

      window.$docsify = {
        name: 'Dosai documentation',
        repo: 'https://github.com/owasp-dep-scan/dosai/tree/main/docs',
        loadSidebar: true,
        subMaxLevel: 3,
        coverpage: '_coverpage.md',
        auto2top: true,
        autoHeader: false,
        logo: '_media/dosai.svg',
        onlyCover: false,
        themeColor: '#d97706',
        search: {
          noData: {
            '/': 'No results!'
          },
          paths: 'auto',
          placeholder: {
            '/': 'Search'
          }
        },
        plugins: [
          function mermaidPlugin(hook) {
            function decode(code) {
              var decoded = code
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>')
                .replace(/&quot;/g, '"')
                .replace(/&#39;/g, "'");
              return decoded.replace(/&amp;/g, '&');
            }
            hook.afterEach(function (html, next) {
              var replaced = html.replace(
                /<pre[^>]*><code class="lang-mermaid[^"]*">([\s\S]*?)<\/code><\/pre>/g,
                function (match, code) {
                  return '<div class="mermaid">' + decode(code) + '</div>';
                }
              );
              next(replaced);
            });
            hook.doneEach(function () {
              if (window.mermaid && window.mermaid.run) {
                window.mermaid.initialize({
                  startOnLoad: false,
                  theme: mermaidTheme(),
                  suppressErrorRendering: true
                });
                try {
                  window.mermaid.run({ querySelector: '.mermaid' });
                } catch (e) {
                  /* a broken diagram should never take the page down */
                }
              }
            });
          }
        ]
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  </body>
</html>
